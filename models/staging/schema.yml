version: 2

sources:
  - name: staging
    database: "{{ env_var('DBT_BIGQUERY_PROJECT', 'di-malrokh-sandbox-malrokh') }}"
    schema: "{{ env_var('DBT_BIGQUERY_SOURCE_DATASET', 'week4') }}"
    tables:
      - name: green
      - name: yellow
      - name: taxi_zone_lookup  # Adding the taxi zone lookup table as a source
      - name: fhv

models:
  - name: stg_green_tripdata
    description: >
      Trip made by green taxis, also known as boro taxis and street-hail liveries.
    columns:
      - name: tripid
        description: Primary key for this table, generated with a concatenation of vendorid+pickup_datetime
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn
      - name: Payment_type
        description: >
          A numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              values: "{{ var('payment_type_values', [1, 2, 3, 4, 5, 6]) }}"
              severity: warn
              quote: false

  - name: stg_yellow_tripdata
    description: >
      Trips made by New York City's iconic yellow taxis.
    columns:
      - name: tripid
        description: Primary key for this table, generated with a concatenation of vendorid+pickup_datetime
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn
      - name: Payment_type
        description: >
          A numeric code signifying how the passenger paid for the trip.
        tests:
          - accepted_values:
              values: "{{ var('payment_type_values', [1, 2, 3, 4, 5, 6]) }}"
              severity: warn
              quote: false

  - name: stg_taxi_zone_lookup  # New staging model for taxi zones
    description: >
      NYC Taxi Zone Lookup Table, mapping location IDs to boroughs and zones.
    columns:
      - name: locationid
        description: Unique identifier for a taxi zone.
        tests:
          - unique:
              severity: warn
          - not_null:
              severity: warn
      - name: borough
        description: NYC borough name.
      - name: zone
        description: Name of the taxi zone.
      - name: service_zone
        description: Service zone, transformed to replace "Boro" with "Green".

  - name: stg_fhv
    description: "Staging model for FHV trip data"
    columns:
      - name: dispatching_base_num
        description: "Dispatch base number for the FHV vehicle"
      - name: pickup_datetime
        description: "Pickup datetime for the trip"
      - name: dropOff_datetime
        description: "Drop-off datetime for the trip"
      - name: PUlocationID
        description: "Pickup location ID"
      - name: DOlocationID
        description: "Drop-off location ID"
      - name: SR_Flag
        description: "Indicates if the trip was a shared ride"
      - name: Affiliated_base_number
        description: "The affiliated base number for the FHV"
